name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push images to GitHub Container Registry

env:
  IMAGE_NAME: ghcr.io/chitu09/hedge-fund-simulator

jobs:
  # ── 1. Lint + unit tests ───────────────────────────────────────────────────
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (syntax errors / undefined names)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Unit tests
        run: pytest -q tests

  # ── 2. Build image, push to GHCR (+ ACR if configured) ─────────────────────
  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Image tags (sha, branch, semver on v* tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker build -t smoke .
          docker run -d -p 8501:8501 --name smoke smoke
          for i in $(seq 1 30); do
            curl -fs http://localhost:8501/_stcore/health && exit 0
            sleep 2
          done
          docker logs smoke; exit 1

  # ── 3. Deploy to AKS (only on main/tags, only if Azure secret is set) ──────
  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if Azure is not configured
        if: env.AZURE_CREDENTIALS == ''
        run: echo "AZURE_CREDENTIALS not set – skipping deploy." && exit 0

      - uses: azure/login@v2
        if: env.AZURE_CREDENTIALS != ''
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - uses: azure/aks-set-context@v4
        if: env.AZURE_CREDENTIALS != ''
        with:
          resource-group: ${{ vars.AKS_RESOURCE_GROUP }}
          cluster-name: ${{ vars.AKS_CLUSTER_NAME }}

      - name: Apply manifests with the new image
        if: env.AZURE_CREDENTIALS != ''
        run: |
          IMAGE="${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/
          kubectl -n hedge-fund set image deployment/hedge-fund-sim app="$IMAGE"
          kubectl -n hedge-fund rollout status deployment/hedge-fund-sim --timeout=180s
