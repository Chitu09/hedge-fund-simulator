apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hedge-fund-sim
  namespace: hedge-fund
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hedge-fund-sim
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
